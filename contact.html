<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us | Official Yono Games</title>

<meta name="description" content="Contact Official Yono Games for general inquiries and website-related questions.">

<link rel="stylesheet" href="style.css">

<style>

.contact-box{
background:#fff;
padding:40px;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
max-width:800px;
margin:auto;
}

.contact-box input,
.contact-box textarea{

width:100%;
padding:15px;
margin:12px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:16px;

}

.contact-box button{

background:#0b57d0;
color:#fff;
padding:15px 35px;
border:none;
border-radius:30px;
cursor:pointer;
font-size:16px;

}

.contact-box button:hover{

background:#0847ab;

}

.info{

margin-top:30px;
text-align:center;

}

</style>

</head>

<body>

<header>

<div class="container">

<h1>Official Yono Games</h1>

<nav>

<a href="index.html">Home</a>

<a href="about.html">About</a>

<a href="blog.html">Blog</a>

<a href="contact.html">Contact</a>

<a href="disclaimer.html">Disclaimer</a>

</nav>

</div>

</header>

<section class="hero">

<div class="container">

<h2>Contact Us</h2>

<p>

Have a question or feedback? We'd love to hear from you.

</p>

</div>

</section>

<section>

<div class="container">

<div class="contact-box">

<form>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<textarea rows="6" placeholder="Your Message"></textarea>

<button type="submit">Send Message</button>

</form>

<div class="info">

<h3>Email</h3>

<p>contact@example.com</p>

<h3>Website</h3>

<p>Official Yono Games</p>

</div>

</div>

</div>

</section>

<footer>

<p>

© 2026 Official Yono Games. All Rights Reserved.

</p>

</footer>

</body>
</html>
